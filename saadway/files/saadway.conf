# /etc/config/saadway — UCI defaults (T009)
# Values per contracts/uci.md and ratified clarifications:
#   kill_switch=0 (Q2-B opt-in), failover_attempts=3, failover_cooldown=300
#   (Q3-A), probe_interval=30, stats_interval=1 (D2), dashboard language=fa
#   (Q4-A Persian-first RTL), auth=dedicated, session_timeout=1800 (FR-020).

config service 'service'
	option enabled '1'
	option active_profile ''
	option connection_status 'down'
	option failover_attempts '3'
	option failover_cooldown '300'
	option probe_interval '30'
	option stats_interval '1'
	option kill_switch '0'
	option iprange_bypass '0'

config dashboard 'dashboard'
	option language 'fa'
	option authentication 'dedicated'
	option session_timeout '1800'
