<!DOCTYPE html>
<!--
  SaadWay standalone dashboard (T029) — Persian-first RTL SPA.
  Served by uhttpd from /www/saadway/ at http://<router>/saadway/.
  The ONLY transport is POST /ubus JSON-RPC 2.0 (uhttpd-mod-ubus, same
  origin) — js/api.js owns the session-token lifecycle (T030).

  Constitution compliance notes:
  - Principle V: purely client-side SPA; every privileged action passes an
    authenticated ubus session (login via session.login, ACL least
    privilege). No CGI, no direct file APIs, no token in URLs/logs.
  - Self-hosted only: no CDN, no external fonts/network fetches (offline router).
  - RTL-first (FR-027/Q4-A): Persian default, LTR switch for English.
-->
<html lang="fa" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="referrer" content="no-referrer">
	<meta http-equiv="Content-Security-Policy"
	      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
	<title>SaadWay — Tunnel and Routing Dashboard</title>
	<link rel="stylesheet" href="css/base.css">
</head>
<body>
	<header id="topbar" class="topbar">
		<div class="brand">
			<span class="logo" aria-hidden="true">س</span>
			<div>
				<div class="brand-name" data-i18n="app_name">SaadWay</div>
				<div class="brand-sub" data-i18n="app_sub">داشبورد تونل و مسیریابی</div>
			</div>
		</div>
		<div id="conn-badge" class="badge hidden"></div>
		<div class="topbar-actions">
			<select id="lang-switch" aria-label="Language">
				<option value="fa">فارسی</option>
				<option value="en">English</option>
			</select>
			<button id="btn-logout" class="btn ghost hidden" data-i18n="logout">خروج</button>
		</div>
	</header>

	<!-- login gate (no token in URL; session token only in RAM) -->
	<section id="view-login" class="card center hidden">
		<h2 data-i18n="login_title">ورود به داشبورد</h2>
		<form id="login-form" autocomplete="off">
			<label for="login-user" data-i18n="username">نام کاربری</label>
			<input id="login-user" name="username" value="admin" autocapitalize="off" spellcheck="false">
			<label for="login-pass" data-i18n="password">گذرواژه</label>
			<input id="login-pass" name="password" type="password" autocomplete="current-password">
			<button type="submit" class="btn primary" data-i18n="login">ورود</button>
			<div id="login-err" class="error hidden"></div>
		</form>
	</section>

	<!-- main app shell -->
	<main id="view-app" class="app hidden">
		<nav id="tabbar" class="tabbar" role="tablist">
			<button class="tab active" data-tab="profiles" data-i18n="tab_profiles">پروفایل‌ها</button>
			<button class="tab" data-tab="steering" data-i18n="tab_steering">مسیریابی</button>
			<button class="tab" data-tab="security" data-i18n="tab_security">امنیت</button>
			<button class="tab" data-tab="monitoring" data-i18n="tab_monitoring">پایش</button>
			<button class="tab" data-tab="maintenance" data-i18n="tab_maintenance">پشتیبان</button>
		</nav>
		<section id="panel-profiles"></section>
		<section id="panel-steering"></section>
		<section id="panel-security"></section>
		<section id="panel-monitoring"></section>
		<section id="panel-maintenance"></section>
	</main>

	<footer class="footnote">
		<span data-i18n="footer_note">Surface strictly limited to the /ubus JSON-RPC API — secrets are never displayed.</span>
	</footer>

	<div id="toast" class="toast hidden"></div>

	<script src="js/i18n.js"></script>
	<script src="js/api.js"></script>
	<script src="js/chart.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
